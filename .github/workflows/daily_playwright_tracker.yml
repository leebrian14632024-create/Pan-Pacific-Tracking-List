name: Daily Ocean ETA Playwright Crawler

on:
  schedule:
    # 每日美東時間早上 8:00 (夏令 UTC 12:00 / 冬令 UTC 13:00)
    - cron: '0 12 * * *'
  workflow_dispatch: # 支援在 GitHub 介面上手動隨時點擊「Run workflow」立即執行

permissions:
  contents: write

jobs:
  run-crawler:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Playwright & Browsers
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Execute Crawler
        run: |
          python playwright_tracker.py

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add shipments.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update ETA via Playwright [$(date +'%Y-%m-%d')]" && git push)
